[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mysqli",
    "php82Extensions.curl",
    "php82Extensions.mbstring",
    "php82Extensions.gd",
    "php82Extensions.openssl",
    "composer"
]

[phases.install]
cmds = ["composer install --no-interaction --optimize-autoloader --no-dev --ignore-platform-reqs || composer require aws/aws-sdk-php:^3.290 --no-interaction --optimize-autoloader --ignore-platform-reqs"]

[start]
cmd = "php -S 0.0.0.0:$PORT -t . router.php"
